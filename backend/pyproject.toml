[project]
name = "agentic-ops-backend"
version = "0.1.0"
description = "agentic-ops FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain>=1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7",
    "mlflow-skinny>=3.17",
    "pandas>=2.2",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
