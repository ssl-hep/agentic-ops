[project]
name = "agentic-ops-backend"
version = "0.1.0"
description = "agentic-ops FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
