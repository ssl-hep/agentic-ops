[project]
name = "agentic-ops-worker"
version = "0.1.0"
description = "Temporal workflows and activities for EWKit ntuple production"
requires-python = ">=3.12"
dependencies = [
    # The version in the worker environment HTCondor jobs unpack (phase0/workerenv); workflows
    # and the jobs' shim must agree on the SDK.
    "temporalio==1.34.0",
    # The reporting schema (controller activities); workflow code never imports them
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.scripts]
agentic-ops-migrate = "agentic_ops_worker.migrate:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
