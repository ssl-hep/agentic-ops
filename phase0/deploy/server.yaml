# Phase 0 Temporal server on River, namespace ai-ops. Rendered by deploy/render.sh, which
# fills in __IMAGE__. The TLS Secret is created from secrets/phase0-certs/server (see README).
# One replica only: SQLite on a ReadWriteOnce volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temporal-phase0-data
  namespace: ai-ops
  labels: {app.kubernetes.io/name: temporal-phase0}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-phase0
  namespace: ai-ops
  labels: {app.kubernetes.io/name: temporal-phase0}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: temporal-phase0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: temporal-phase0}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: temporal
          image: __IMAGE__
          imagePullPolicy: Always
          args: ["--namespace", "phase0"]
          ports:
            - {name: grpc, containerPort: 7233}
            - {name: metrics, containerPort: 9090}
          # gRPC health needs a client certificate (requireClientAuth), so probe the socket
          readinessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: grpc}
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/temporal}
            - {name: tls, mountPath: /etc/temporal/tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: temporal-phase0-data}
        - name: tls
          secret: {secretName: temporal-phase0-tls}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-phase0
  namespace: ai-ops
  labels: {app.kubernetes.io/name: temporal-phase0}
spec:
  selector: {app.kubernetes.io/name: temporal-phase0}
  ports:
    - {name: grpc, port: 7233, targetPort: grpc}
    - {name: metrics, port: 9090, targetPort: metrics}
