{{- $component := "backend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentic-ops.fullname" . }}-{{ $component }}
  labels:
    {{- include "agentic-ops.labels" . | nindent 4 }}
    {{- include "agentic-ops.selectorLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentic-ops.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentic-ops.selectorLabels" (dict "ctx" $ "component" $component) | nindent 8 }}
      annotations:
        checksum/db-secret: {{ include (print $.Template.BasePath "/db-secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- range $key := list "DATABASE_URL" "DB_HOST" "DB_PORT" "DB_NAME" "DB_USER" "DB_PASSWORD" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-ops.dbSecretName" $ }}
                  key: {{ $key }}
            {{- end }}
            - name: GITLAB_URL
              value: {{ .Values.gitlab.url | quote }}
            - name: GITLAB_PROJECT
              value: {{ .Values.gitlab.project | quote }}
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gitlab.existingSecret }}
                  key: {{ .Values.gitlab.tokenKey }}
                  optional: true
            {{- with .Values.llm }}
            {{- if .baseUrl }}
            - name: LLM_BASE_URL
              value: {{ .baseUrl | quote }}
            {{- end }}
            {{- if .model }}
            - name: LLM_MODEL
              value: {{ .model | quote }}
            {{- end }}
            {{- if .builderModel }}
            - name: LLM_BUILDER_MODEL
              value: {{ .builderModel | quote }}
            {{- end }}
            {{- if .reviewerModel }}
            - name: LLM_REVIEWER_MODEL
              value: {{ .reviewerModel | quote }}
            {{- end }}
            - name: LLM_STRUCTURED_OUTPUT
              value: {{ .structuredOutput | quote }}
            - name: LLM_TEMPERATURE
              value: {{ .temperature | quote }}
            - name: LLM_TIMEOUT_SECONDS
              value: {{ .timeoutSeconds | quote }}
            - name: LLM_MAX_TOOL_CALLS
              value: {{ .maxToolCalls | quote }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .tokenKey }}
                  optional: true
            {{- end }}
            {{- with .Values.mlflow }}
            {{- if .trackingUri }}
            - name: MLFLOW_TRACKING_URI
              value: {{ .trackingUri | quote }}
            {{- end }}
            - name: MLFLOW_EXPERIMENT
              value: {{ .experiment | quote }}
            - name: MLFLOW_TRACKING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .usernameKey }}
                  optional: true
            - name: MLFLOW_TRACKING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .passwordKey }}
                  optional: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
