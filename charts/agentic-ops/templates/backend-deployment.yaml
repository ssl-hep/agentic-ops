{{- $component := "backend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentic-ops.fullname" . }}-{{ $component }}
  labels:
    {{- include "agentic-ops.labels" . | nindent 4 }}
    {{- include "agentic-ops.selectorLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  {{- if .Values.scratch.enabled }}
  ## The scratch PVC is ReadWriteOnce: stop the old pod before starting the new one
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "agentic-ops.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentic-ops.selectorLabels" (dict "ctx" $ "component" $component) | nindent 8 }}
      annotations:
        checksum/db-secret: {{ include (print $.Template.BasePath "/db-secret.yaml") . | sha256sum }}
        {{- if .Values.kerberos.enabled }}
        checksum/kerberos-config: {{ include (print $.Template.BasePath "/kerberos-configmap.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ## The backend never talks to the Kubernetes API. Without a token, the dataset agent can't
      ## reach it either, e.g. to read the Kerberos Secret.
      automountServiceAccountToken: false
      ## Each container sees only its own processes, so the backend can't read the kerberos
      ## sidecar's memory or files through /proc
      shareProcessNamespace: false
      securityContext:
        ## The backend image runs as uid 10001; let it write the scratch volume
        fsGroup: 10001
      containers:
        - name: {{ $component }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- range $key := list "DATABASE_URL" "DB_HOST" "DB_PORT" "DB_NAME" "DB_USER" "DB_PASSWORD" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic-ops.dbSecretName" $ }}
                  key: {{ $key }}
            {{- end }}
            - name: GITLAB_URL
              value: {{ .Values.gitlab.url | quote }}
            - name: GITLAB_PROJECT
              value: {{ .Values.gitlab.project | quote }}
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gitlab.existingSecret }}
                  key: {{ .Values.gitlab.tokenKey }}
                  optional: true
            {{- with .Values.llm }}
            {{- if .baseUrl }}
            - name: LLM_BASE_URL
              value: {{ .baseUrl | quote }}
            {{- end }}
            {{- if .model }}
            - name: LLM_MODEL
              value: {{ .model | quote }}
            {{- end }}
            - name: LLM_TEMPERATURE
              value: {{ .temperature | quote }}
            - name: LLM_TIMEOUT_SECONDS
              value: {{ .timeoutSeconds | quote }}
            - name: LLM_MAX_TOOL_CALLS
              value: {{ .maxToolCalls | quote }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .apiKeyKey }}
                  optional: true
            {{- end }}
            {{- with .Values.mlflow }}
            {{- if .trackingUri }}
            - name: MLFLOW_TRACKING_URI
              value: {{ .trackingUri | quote }}
            {{- end }}
            - name: MLFLOW_EXPERIMENT
              value: {{ .experiment | quote }}
            - name: MLFLOW_PROMPT
              value: {{ .prompt | quote }}
            - name: MLFLOW_TRACKING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .usernameKey }}
                  optional: true
            - name: MLFLOW_TRACKING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .passwordKey }}
                  optional: true
            {{- end }}
            {{- with .Values.mcp }}
            {{- if .url }}
            - name: MCP_URL
              value: {{ .url | quote }}
            {{- end }}
            - name: MCP_TOOL_ALLOWLIST
              value: {{ .toolAllowlist | toJson | quote }}
            - name: MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .tokenKey }}
                  optional: true
            {{- end }}
            - name: SCRATCH_DIR
              value: {{ .Values.scratch.mountPath | quote }}
            ## The ticket lives only in the kerberos sidecar. Point GSSAPI libraries at a cache
            ## that can't exist, so any Kerberos use in the backend fails instead of finding one.
            - name: KRB5CCNAME
              value: FILE:/nonexistent/krb5cc
          volumeMounts:
            - name: scratch
              mountPath: {{ .Values.scratch.mountPath }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with .Values.kerberos }}
        {{- if .enabled }}
        ## Keeps a ticket in /krb/ccache. Only this container mounts the kerberos-* volumes, and
        ## it serves nothing, so nothing in the backend can reach the password or the ticket.
        - name: kerberos
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          securityContext:
            runAsUser: 10002
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: KRB_PRINCIPAL
              value: {{ required "kerberos.principal is required when kerberos.enabled is true" .principal | quote }}
            - name: KRB_REFRESH_SECONDS
              value: {{ mul .refreshHours 3600 | quote }}
          volumeMounts:
            - name: kerberos-password
              mountPath: /etc/kerberos
              readOnly: true
            - name: kerberos-config
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
              readOnly: true
            - name: kerberos-ccache
              mountPath: /krb
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- end }}
      volumes:
        - name: scratch
          {{- if .Values.scratch.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "agentic-ops.scratchPvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.kerberos.enabled }}
        ## Optional, like the other Secrets: without it the sidecar logs the failure and retries
        - name: kerberos-password
          secret:
            secretName: {{ .Values.kerberos.existingSecret }}
            optional: true
            ## Group-readable by the pod's fsGroup, which the sidecar's uid 10002 belongs to
            defaultMode: 0440
            items:
              - key: {{ .Values.kerberos.passwordKey }}
                path: password
        - name: kerberos-config
          configMap:
            name: {{ include "agentic-ops.fullname" . }}-kerberos
        - name: kerberos-ccache
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
