## Application database. The chart renders a Secret (named by
## postgres.settings.existingSecret) holding these credentials plus a
## DATABASE_URL; both Postgres and the backend read from it.
database:
  name: agenticops
  user: agenticops
  ## Leave empty to auto-generate. Generated passwords are preserved on upgrade.
  password: ""
  ## Superuser (postgres) password. Leave empty to auto-generate.
  superuserPassword: ""

## EWKit on GitLab, read by the backend's campaign browser. The token is not part of
## the chart: create the Secret yourself (see "GitLab token" in the README). Without it
## the backend still starts, and the UI explains what is missing.
gitlab:
  url: https://gitlab.cern.ch
  project: atlas-physics/hmbs/ewk/EWKit
  existingSecret: agentic-ops-gitlab
  tokenKey: GITLAB_TOKEN

## OpenAI-compatible model endpoint for the run setup agents (builder and reviewer).
## The API token is not part of the chart: create the Secret yourself (see "Model
## endpoint" in the README). Without baseUrl and model the agents are off, and the
## Run setup form and its input checks still work.
llm:
  ## Base URL up to and including /v1, e.g. https://llm.example.org/v1
  baseUrl: "https://lumen.ncsa.illinois.edu/v1"
  model: "deepseek"
  ## Optional per-agent overrides of model
  builderModel: ""
  reviewerModel: ""
  ## How the agents get structured answers: function_calling (works with most
  ## OpenAI-compatible servers), json_schema (OpenAI structured outputs) or json_mode
  structuredOutput: function_calling
  temperature: 0
  timeoutSeconds: 120
  ## Repository tool calls each agent may make before it must answer
  maxToolCalls: 8
  existingSecret: agentic-ops-llm
  tokenKey: LLM_API_KEY

backend:
  replicaCount: 1
  image:
    repository: agentic-ops-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources: {}

frontend:
  replicaCount: 1
  image:
    repository: agentic-ops-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources: {}

imagePullSecrets: []

## groundhog2k/postgres subchart (official docker.io/postgres image)
## https://github.com/groundhog2k/helm-charts/tree/master/charts/postgres
postgres:
  settings:
    existingSecret: agentic-ops-db-credentials
    superuserPassword:
      secretKey: POSTGRES_PASSWORD
  userDatabase:
    existingSecret: agentic-ops-db-credentials
    name:
      secretKey: DB_NAME
    user:
      secretKey: DB_USER
    password:
      secretKey: DB_PASSWORD
  storage:
    requestedSize: 1Gi
