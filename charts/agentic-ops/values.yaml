## Application database. The chart renders a Secret (named by
## postgres.settings.existingSecret) holding these credentials plus a
## DATABASE_URL; both Postgres and the backend read from it.
database:
  name: agenticops
  user: agenticops
  ## Leave empty to auto-generate. Generated passwords are preserved on upgrade.
  password: ""
  ## Superuser (postgres) password. Leave empty to auto-generate.
  superuserPassword: ""

## EWKit on GitLab, read by the backend's campaign browser. The token is not part of
## the chart: create the Secret yourself (see "GitLab token" in the README). Without it
## the backend still starts, and the UI explains what is missing.
gitlab:
  url: https://gitlab.cern.ch
  project: atlas-physics/hmbs/ewk/EWKit
  existingSecret: agentic-ops-gitlab
  tokenKey: GITLAB_TOKEN

## OpenAI-compatible chat completions endpoint for the dataset-narrowing agent. The agent is
## off unless both baseUrl and model are set. The API key is not part of the chart: create
## the Secret yourself (see "Dataset agent" in the README).
llm:
  ## Base URL up to and including /v1, e.g. https://llm.example.org/v1
  baseUrl: "https://lumen.ncsa.illinois.edu/v1"
  model: "glm"
  temperature: 0.0
  timeoutSeconds: 120
  ## Tool calls (dataset and Rucio) the agent may make per message before it must answer
  maxToolCalls: 25
  existingSecret: agentic-ops-llm
  apiKeyKey: LLM_API_KEY

## MLflow tracking server. The agent loads its system prompt from the Prompt Registry and logs
## every message as a run in the experiment. Credentials come from a Secret you create.
mlflow:
  ## Without credentials in it; they come from the Secret
  trackingUri: https://mlflow.servicex.ssl-hep.org
  experiment: ew-kit
  ## Prompt name and alias (or version) in the Prompt Registry
  prompt: "ew-kit-dataset-narrower@champion"
  existingSecret: agentic-ops-mlflow
  usernameKey: MLFLOW_TRACKING_USERNAME
  passwordKey: MLFLOW_TRACKING_PASSWORD

## AF MCP gateway, for read-only Rucio lookups with a shared service token from a Secret.
mcp:
  url: https://mcp.af.uchicago.edu/mcp/
  ## Globs of the MCP tools the agent may call; tools not marked read-only are dropped regardless
  toolAllowlist:
    - "rucio_list*"
    - "rucio_get*"
  existingSecret: agentic-ops-mcp
  tokenKey: MCP_BEARER_TOKEN

## Kerberos ticket, kept by a `kerberos` sidecar container in the backend pod. The password,
## krb5.conf and ticket cache are mounted only in the sidecar, so the backend, and the dataset
## agent inside it, can never read them. Off by default. The password is not part of the chart:
## create the Secret yourself (see "Kerberos" in the README).
kerberos:
  enabled: true
  ## e.g. someone@CERN.CH
  principal: "bgalewsk"
  existingSecret: agentic-ops-kerberos
  passwordKey: KERBEROS_PASSWORD
  ## Get a new ticket this often; keep it well under the realm's ticket lifetime (25h at CERN)
  refreshHours: 6
  image:
    repository: agentic-ops-kerberos
    tag: latest
    pullPolicy: IfNotPresent
  resources: {}
  krb5Conf: |
    [libdefaults]
      default_realm = CERN.CH
      dns_lookup_kdc = true
      dns_lookup_realm = false
      rdns = false
    [realms]
      CERN.CH = {
        kdc = cerndc.cern.ch
        default_domain = cern.ch
      }
    [domain_realm]
      .cern.ch = CERN.CH
      cern.ch = CERN.CH

## Volume for the agent's dataset selections (<mountPath>/<folder>/<id>.txt). The PVC is
## ReadWriteOnce, so the backend is updated with the Recreate strategy while it is enabled.
## When disabled, an emptyDir is mounted instead and selections are lost on pod restart.
scratch:
  enabled: true
  size: 1Gi
  ## Empty uses the cluster's default StorageClass
  storageClass: ""
  mountPath: /scratch

backend:
  replicaCount: 1
  image:
    repository: agentic-ops-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources: {}

frontend:
  replicaCount: 1
  image:
    repository: agentic-ops-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources: {}

imagePullSecrets: []

## groundhog2k/postgres subchart (official docker.io/postgres image)
## https://github.com/groundhog2k/helm-charts/tree/master/charts/postgres
postgres:
  settings:
    existingSecret: agentic-ops-db-credentials
    superuserPassword:
      secretKey: POSTGRES_PASSWORD
  userDatabase:
    existingSecret: agentic-ops-db-credentials
    name:
      secretKey: DB_NAME
    user:
      secretKey: DB_USER
    password:
      secretKey: DB_PASSWORD
  storage:
    requestedSize: 1Gi
