## In-cluster access: controller pods, the Web UI and metrics scraping
apiVersion: v1
kind: Service
metadata:
  name: {{ include "temporal.fullname" . }}
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
    ## What the ServiceMonitor selects; the public Service does not carry it
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    {{- include "temporal.selectorLabels" (dict "ctx" $ "component" "server") | nindent 4 }}
  ports:
    - {name: grpc, port: 7233, targetPort: grpc}
    - {name: metrics, port: 9090, targetPort: metrics}
---
## Headless: the name resolves to the server pod's IP, bypassing the ClusterIP and the node's
## service proxy. In-cluster clients (the Web UI) dial this; on River the ClusterIP path timed
## out from river-c* nodes while pod-to-pod traffic worked (2026-11-18).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "temporal.fullname" . }}-headless
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "temporal.selectorLabels" (dict "ctx" $ "component" "server") | nindent 4 }}
  ports:
    - {name: grpc, port: 7233, targetPort: grpc}
