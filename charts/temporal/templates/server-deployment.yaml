{{- $component := "server" }}
{{- $secret := include "temporal.dbSecretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "temporal.fullname" . }}
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
    {{- include "temporal.selectorLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  ## Exactly one: the server config keeps every service but the frontend on localhost
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "temporal.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "temporal.selectorLabels" (dict "ctx" $ "component" $component) | nindent 8 }}
      annotations:
        checksum/db-secret: {{ include (print $.Template.BasePath "/db-secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      ## Schema setup and upgrade with temporal-sql-tool from the same image, on every start.
      ## setup-schema -v 0.0 only creates the version tables (it skips a database that is
      ## already further along), and update-schema applies only the versions not yet applied.
      ## They fail and are retried while Postgres is still starting.
      initContainers:
        {{- range $store := list (dict "name" "temporal" "key" "DB_NAME" "schema" "postgresql/v12/temporal") (dict "name" "visibility" "key" "VISIBILITY_DB_NAME" "schema" "postgresql/v12/visibility") }}
        {{- range $step := list "setup" "update" }}
        - name: schema-{{ $step }}-{{ $store.name }}
          image: {{ include "temporal.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["/usr/local/bin/temporal-sql-tool"]
          {{- if eq $step "setup" }}
          args: ["setup-schema", "-v", "0.0"]
          {{- else }}
          args: ["update-schema", "--schema-name", {{ $store.schema | quote }}]
          {{- end }}
          env:
            {{- include "temporal.sqlToolEnv" (dict "ctx" $ "database" $store.key) | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $.Values.schemaResources | nindent 12 }}
        {{- end }}
        {{- end }}
      containers:
        - name: temporal
          image: {{ include "temporal.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--namespace", {{ .Values.temporal.namespace | quote }}, "--worker-ca", "/etc/temporal/tls/worker-ca.pem"]
          ports:
            - {name: grpc, containerPort: 7233}
            - {name: metrics, containerPort: 9090}
          env:
            {{- range $env, $key := dict "TEMPORAL_DB_HOST" "DB_HOST" "TEMPORAL_DB_PORT" "DB_PORT" "TEMPORAL_DB_USER" "DB_USER" "TEMPORAL_DB_PASSWORD" "DB_PASSWORD" "TEMPORAL_DB_NAME" "DB_NAME" "TEMPORAL_VISIBILITY_DB_NAME" "VISIBILITY_DB_NAME" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
            {{- end }}
            - name: TEMPORAL_NUM_HISTORY_SHARDS
              value: {{ .Values.temporal.numHistoryShards | quote }}
            - name: TEMPORAL_DB_MAX_CONNS
              value: {{ .Values.temporal.dbMaxConns | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.temporal.logLevel | quote }}
          # gRPC health needs a client certificate (requireClientAuth), so probe the socket
          readinessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: grpc}
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tls, mountPath: /etc/temporal/tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        ## server.pem, server-key.pem, ca.pem and worker-ca.pem, from agentic-ops-pki server.
        ## Read at start: restart after changing the Secret.
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        - name: tmp
          emptyDir: {}
