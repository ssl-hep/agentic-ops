{{- $secretName := include "temporal.dbSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName).data | default dict }}
{{- $password := .Values.database.password | default (get $existing "DB_PASSWORD" | b64dec) | default (randAlphaNum 24) }}
{{- $superPassword := .Values.database.superuserPassword | default (get $existing "POSTGRES_PASSWORD" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
  annotations:
    # Keep credentials on uninstall so they still match the retained Postgres PVC
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $superPassword | quote }}
  DB_HOST: {{ include "temporal.postgresHost" . | quote }}
  DB_PORT: {{ .Values.postgres.service.port | default 5432 | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  VISIBILITY_DB_NAME: {{ .Values.database.visibilityName | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  DB_PASSWORD: {{ $password | quote }}
