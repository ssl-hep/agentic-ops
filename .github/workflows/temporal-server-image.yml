# Build the Temporal server image (temporal-server/) on every push to any branch and push it
# to Docker Hub, tagged with the branch name ("/" becomes "-", e.g. feat/x -> feat-x). Tags
# move with the branch; charts/temporal pulls on every start.
#
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token
# with read & write access to the bengal1 repositories).
name: temporal-server image

on:
  push:
    branches: ['**']

concurrency:
  group: temporal-server-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/bengal1/agentic-ops-temporal-server

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: temporal-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: temporal-server/go.mod
          cache-dependency-path: temporal-server/go.sum
      - run: go vet -tags disable_grpc_modules ./...
      - run: go test -tags disable_grpc_modules ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=ref,event=branch
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: temporal-server
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
