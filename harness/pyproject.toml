[project]
name = "agentic-ops-harness"
version = "0.1.0"
description = "Agent evaluation harness: prompts, questions and runs tracked in MLflow GenAI"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.2",
    "mlflow>=3.17",
    "python-dotenv>=1.2.4",
]

[project.scripts]
harness = "agent_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_harness"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
